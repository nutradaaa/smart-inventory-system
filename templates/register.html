<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t['register_heading'] }}</title>
    <style>
        @font-face {
            font-family: 'Lookpeach';
            src: url('/static/fonts/lookpeach.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Lookpeach', sans-serif;
            background-color: #e2d6f7;
            background-image: radial-gradient(rgba(255, 255, 255, 0.75) 1.6px, transparent 1.6px);
            background-size: 26px 26px;
            color: #333333;
            min-height: 100vh;
        }

        .lang-switch-top {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 24px 0 0;
        }

        .lang-btn {
            font-family: 'Lookpeach', sans-serif;
            font-size: 1rem;
            padding: 8px 22px;
            border-radius: 999px;
            border: 2px solid #333333;
            text-decoration: none;
            color: #333333;
            background: #cdb8f0;
        }

        .lang-btn.active {
            background: #a780e8;
        }

        .center-wrap {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #333333;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: normal;
            margin: 0 0 24px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 1.05rem;
            margin: 16px 0 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            font-family: 'Lookpeach', sans-serif;
            font-size: 1.05rem;
            border-radius: 999px;
            border: 2px solid #333333;
            padding: 12px 20px;
            outline: none;
        }

        .error-msg {
            background: #ffd6d6;
            border: 2px solid #333333;
            border-radius: 14px;
            padding: 10px 16px;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .submit-btn {
            font-family: 'Lookpeach', sans-serif;
            font-size: 1.1rem;
            border-radius: 999px;
            border: 2px solid #333333;
            padding: 13px 30px;
            background: #ffaed4;
            cursor: pointer;
            margin-top: 24px;
            width: 100%;
        }

        .switch-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #7a5bb5;
            text-decoration: none;
        }

        .switch-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="lang-switch-top">
        <a href="/set-language/th" class="lang-btn {% if lang == 'th' %}active{% endif %}">ไทย</a>
        <a href="/set-language/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">English</a>
        <a href="/set-language/ko" class="lang-btn {% if lang == 'ko' %}active{% endif %}">한국어</a>
    </div>

    <div class="center-wrap">
        <div class="card">
            <h1>{{ t['register_heading'] }}</h1>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <label for="username">{{ t['label_username'] }}</label>
                <input type="text" id="username" name="username" required>

                <label for="password">{{ t['label_password'] }}</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="submit-btn">{{ t['register_btn'] }}</button>
            </form>

            <a href="/login" class="switch-link">{{ t['switch_to_login'] }}</a>
        </div>
    </div>
</body>
</html>
